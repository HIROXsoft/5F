<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>会議室 空室状況マップ</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #182235;
      --muted: #667085;
      --free: #12a05c;
      --free-soft: rgba(18, 160, 92, .72);
      --busy: #e53935;
      --busy-soft: rgba(229, 57, 53, .72);
      --checking: #2563eb;
      --checking-soft: rgba(37, 99, 235, .62);
      --error: #6b7280;
      --error-soft: rgba(107, 114, 128, .62);
      --shadow: 0 16px 44px rgba(15, 23, 42, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #e8f1ff 0, transparent 34%), var(--bg);
    }
    .page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: clamp(12px, 2.4vw, 24px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .title h1 {
      margin: 0 0 4px;
      font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      letter-spacing: .03em;
      line-height: 1.15;
    }
    .title p { margin: 0; color: var(--muted); font-weight: 700; }
    .clock {
      text-align: right;
      white-space: nowrap;
      font-weight: 900;
    }
    #clockTime { font-size: clamp(2rem, 5vw, 4.2rem); line-height: .95; }
    #clockDate { margin-top: 5px; color: var(--muted); font-size: clamp(.86rem, 1.8vw, 1.05rem); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
      align-items: stretch;
    }
    .map-card, .side-card {
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(148, 163, 184, .26);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .map-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .map-head strong { font-size: 1.1rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 800; font-size: .86rem; }
    .legend i { width: 12px; height: 12px; border-radius: 999px; display: inline-block; }
    .dot-free { background: var(--free); }
    .dot-busy { background: var(--busy); }
    .dot-checking { background: var(--checking); }
    .map-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1935 / 1407;
      background: #e5e7eb;
      user-select: none;
      overflow: hidden;
    }
    .floor-img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      transform-origin: center center;
    }
    .room-zone {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      border: 5px solid rgba(255,255,255,.85);
      border-radius: 4px;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, .15), inset 0 0 0 999px var(--checking-soft);
      outline: none;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .room-zone:hover, .room-zone:focus-visible {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 12px 30px rgba(15, 23, 42, .22), 0 0 0 5px rgba(37, 99, 235, .22), inset 0 0 0 999px var(--checking-soft);
      filter: brightness(1.03);
    }
    .room-zone.free { box-shadow: 0 0 0 3px rgba(18,160,92,.45), inset 0 0 0 999px var(--free-soft); border-color: #10b981; }
    .room-zone.busy { box-shadow: 0 0 0 3px rgba(229,57,53,.46), inset 0 0 0 999px var(--busy-soft); border-color: #ef4444; }
    .room-zone.error { box-shadow: 0 0 0 3px rgba(107,114,128,.42), inset 0 0 0 999px var(--error-soft); border-color: #6b7280; }
    .room-zone.free:hover, .room-zone.free:focus-visible { box-shadow: 0 12px 30px rgba(15, 23, 42, .22), 0 0 0 5px rgba(18,160,92,.22), inset 0 0 0 999px var(--free-soft); }
    .room-zone.busy:hover, .room-zone.busy:focus-visible { box-shadow: 0 12px 30px rgba(15, 23, 42, .22), 0 0 0 5px rgba(229,57,53,.22), inset 0 0 0 999px var(--busy-soft); }
    .room-label {
      width: min(88%, 280px);
      max-height: 86%;
      text-align: center;
      padding: clamp(6px, 1vw, 12px) clamp(8px, 1.4vw, 16px);
      border-radius: 14px;
      background: rgba(0,0,0,.36);
      backdrop-filter: blur(4px);
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, .35vw, 5px);
      overflow: hidden;
    }
    .room-name {
      display: block;
      width: 100%;
      font-size: clamp(.72rem, 1.35vw, 1.16rem);
      font-weight: 900;
      line-height: 1.08;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: .01em;
    }
    .room-status {
      display: block;
      width: 100%;
      margin-top: 0;
      font-size: clamp(1.25rem, 2.75vw, 2.45rem);
      font-weight: 1000;
      line-height: .95;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .room-sub {
      display: block;
      width: 100%;
      margin-top: 0;
      font-size: clamp(.55rem, .95vw, .78rem);
      font-weight: 800;
      line-height: 1.22;
      opacity: .96;
      overflow-wrap: anywhere;
    }
    /* 平面図180度回転後の会議室位置（文字は正立のまま） */
    .room1 { left: 7.40%; top: 51.46%; width: 57.82%; height: 46.90%; }
    .room2 { left: 66.30%; top: 51.75%; width: 32.45%; height: 30.48%; }
    .room3 { left: 1.92%; top: 23.77%; width: 28.52%; height: 26.70%; }
    .room1 .room-label { width: min(76%, 330px); }
    .room2 .room-label { width: min(88%, 250px); }
    .room3 .room-label {
      width: min(94%, 210px);
      padding: clamp(4px, .7vw, 8px) clamp(5px, .9vw, 10px);
      border-radius: 12px;
      gap: 2px;
    }
    .room3 .room-name { font-size: clamp(.54rem, .95vw, .9rem); line-height: 1.05; }
    .room3 .room-status { font-size: clamp(1.05rem, 2.05vw, 1.85rem); letter-spacing: .02em; }
    .room3 .room-sub { font-size: clamp(.45rem, .78vw, .64rem); line-height: 1.18; }
    .side-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .side-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .side-title h2 { margin: 0; font-size: 1.1rem; }
    .refresh-btn {
      appearance: none;
      border: 0;
      background: #172554;
      color: #fff;
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .refresh-btn:disabled { opacity: .5; cursor: wait; }
    .status-list { display: grid; gap: 10px; }
    .status-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 13px;
      background: #fff;
      transition: transform .15s ease, border-color .15s ease;
    }
    .status-card:hover { transform: translateY(-1px); border-color: #94a3b8; }
    .status-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .status-line strong { font-size: 1rem; }
    .pill {
      border-radius: 999px;
      padding: 6px 10px;
      color: #fff;
      font-weight: 900;
      font-size: .9rem;
      min-width: 76px;
      text-align: center;
    }
    .pill.free { background: var(--free); }
    .pill.busy { background: var(--busy); }
    .pill.checking { background: var(--checking); }
    .pill.error { background: var(--error); }
    .detail { margin-top: 8px; color: var(--muted); font-size: .88rem; font-weight: 700; line-height: 1.45; }
    .notice { color: var(--muted); font-size: .84rem; line-height: 1.5; margin-top: auto; }

    /* Surface Studio 2向け・マップ拡大表示。ブラウザの縦横比に依存せず横幅で適用 */
    @media (min-width: 1200px) {
      .page {
        width: 100%;
        max-width: none;
        padding: 8px 12px 10px;
      }
      .topbar {
        margin-bottom: 6px;
        gap: 10px;
      }
      .title h1 { font-size: clamp(1.75rem, 1.8vw, 2.5rem); }
      .title p { font-size: clamp(.88rem, .72vw, 1.08rem); }
      #clockTime { font-size: clamp(3rem, 3.8vw, 4.8rem); }
      #clockDate { font-size: clamp(.9rem, .82vw, 1.12rem); }
      .layout {
        grid-template-columns: minmax(0, 1fr) clamp(235px, 15.5vw, 285px);
        gap: 10px;
      }
      .map-card, .side-card { border-radius: 18px; }
      .map-head { padding: 9px 13px; }
      .map-head strong, .side-title h2 { font-size: 1.08rem; }
      .legend { gap: 6px; }
      .legend span { font-size: .78rem; }
      .side-card { padding: 11px; gap: 8px; }
      .status-list { gap: 7px; }
      .status-card { padding: 10px; border-radius: 14px; }
      .status-line strong { font-size: .95rem; }
      .pill { min-width: 68px; padding: 5px 8px; font-size: .82rem; }
      .detail { margin-top: 6px; font-size: .78rem; line-height: 1.35; }
      .notice { font-size: .78rem; }
      .refresh-btn { padding: 7px 11px; font-size: .84rem; }
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .side-card { order: -1; }
      .status-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .clock { text-align: left; }
      .map-head { align-items: flex-start; flex-direction: column; }
      .legend { justify-content: flex-start; }
      .status-list { grid-template-columns: 1fr; }
      .room-zone { border-width: 3px; }
      .room-label { padding: 5px 6px; border-radius: 10px; width: min(92%, 220px); }
      .room-name { font-size: clamp(.54rem, 2.1vw, .9rem); }
      .room-status { font-size: clamp(.9rem, 4.4vw, 1.8rem); }
      .room-sub { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="title">
        <h1>会議室 空室状況マップ</h1>
        <p>部屋をクリックすると各会議室の予約画面を開きます。</p>
      </div>
      <div class="clock" aria-live="polite">

      <aside class="side-card">
        <div class="side-title">
          <h2>一覧表示</h2>
          <button class="refresh-btn" type="button" id="refreshBtn" onclick="refreshAll()">更新</button>
        </div>
        <div class="status-list">
          <a class="status-card" href="https://hiroxsoft.github.io/room1">
            <div class="status-line"><strong>C1</strong><span class="pill checking" id="pill-room-1">確認中</span></div>
            <div class="detail" id="side-detail-room-1">状況を取得しています。</div>
          </a>
          <a class="status-card" href="https://hiroxsoft.github.io/room2">
            <div class="status-line"><strong>C2</strong><span class="pill checking" id="pill-room-2">確認中</span></div>
            <div class="detail" id="side-detail-room-2">状況を取得しています。</div>
          </a>
          <a class="status-card" href="https://hiroxsoft.github.io/room3">
            <div class="status-line"><strong>C3</strong><span class="pill checking" id="pill-room-3">確認中</span></div>
            <div class="detail" id="side-detail-room-3">状況を取得しています。</div>
          </a>
        </div>
        <div class="notice" id="lastUpdated">最終更新：未取得</div>
      </aside>

  <script>
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxZP2nhSDhOeJebkpQOV2QuuJBl1LuD0U_uD_BRf4TtXZ21eljf98DPe3Tk7goV-yPu/exec';
    const API_KEY = '8169';

    const ROOMS = [
      { id: 'room-1', name: 'C1' },
      { id: 'room-2', name: 'C2' },
      { id: 'room-3', name: 'C3' }
    ];

    const REFRESH_INTERVAL_MS = 60000;
    const REQUEST_GAP_MS = 250;
    const CACHE_MAX_AGE_MS = 120000;
    const CACHE_PREFIX = 'roomStatusCache:v1:';
    let refreshInProgress = false;
    let refreshTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      tickClock();
      setInterval(tickClock, 10000);

      // 前回取得結果があれば先に表示し、画面を「確認中」のまま待たせない。
      restoreCachedStatuses();

      // 初回はバックグラウンドで順番に取得。GASへ同時アクセスしない。
      refreshAll(false);
      scheduleNextRefresh();

      // 非表示タブでは自動更新を止め、戻った時に1回だけ更新する。
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (refreshTimer) clearTimeout(refreshTimer);
          refreshTimer = null;
        } else {
          refreshAll(false);
          scheduleNextRefresh();
        }
      });
    });

    function tickClock() {
      const now = new Date();
      document.getElementById('clockTime').textContent = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('clockDate').textContent = now.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
    }

    function scheduleNextRefresh() {
      if (refreshTimer) clearTimeout(refreshTimer);
      refreshTimer = setTimeout(async () => {
        if (!document.hidden) await refreshAll(false);
        scheduleNextRefresh();
      }, REFRESH_INTERVAL_MS);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function cacheKey(resourceId) {
      return CACHE_PREFIX + resourceId;
    }

    function saveCachedStatus(resourceId, status) {
      try {
        localStorage.setItem(cacheKey(resourceId), JSON.stringify({ savedAt: Date.now(), status }));
      } catch (_) {}
    }

    function restoreCachedStatuses() {
      let newest = 0;
      ROOMS.forEach(room => {
        try {
          const raw = localStorage.getItem(cacheKey(room.id));
          if (!raw) return;
          const cached = JSON.parse(raw);
          if (!cached || !cached.status || !cached.savedAt) return;
          if (Date.now() - cached.savedAt > CACHE_MAX_AGE_MS) return;
          applyStatus(room.id, cached.status);
          newest = Math.max(newest, cached.savedAt);
        } catch (_) {}
      });
      if (newest) {
        document.getElementById('lastUpdated').textContent = '最終更新：' + new Date(newest).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) + '（前回結果）';
      }
    }

    function jsonp(resourceId) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gasMapCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const params = { api: 'quickStatus', apiKey: API_KEY, resourceId, callback: callbackName };
        const url = GAS_ENDPOINT + (GAS_ENDPOINT.includes('?') ? '&' : '?') + new URLSearchParams(params).toString();
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(new Error('タイムアウト')); }, 30000);
        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[callbackName] = data => {
          cleanup();
          if (data && data.ok === false) reject(new Error(data.message || 'APIエラー'));
          else resolve(data || {});
        };
        script.onerror = () => { cleanup(); reject(new Error('取得失敗')); };
        script.src = url;
        document.body.appendChild(script);
      });
    }

    async function refreshAll(manual = true) {
      if (refreshInProgress) return;
      refreshInProgress = true;

      const btn = document.getElementById('refreshBtn');
      if (btn) btn.disabled = true;

      let successCount = 0;
      try {
        // Promise.allを廃止し、1部屋ずつ取得することでGASへの同時実行を抑える。
        for (let i = 0; i < ROOMS.length; i++) {
          const room = ROOMS[i];
          try {
            const data = await jsonp(room.id);
            if (data && data.currentStatus) {
              applyStatus(room.id, data.currentStatus);
              saveCachedStatus(room.id, data.currentStatus);
              successCount++;
            } else {
              applyError(room.id, '応答データなし');
            }
          } catch (err) {
            // 前回表示が残っている場合はエラー表示で上書きしない。
            const raw = (() => { try { return localStorage.getItem(cacheKey(room.id)); } catch (_) { return null; } })();
            if (!raw) applyError(room.id, err.message || String(err));
          }
          if (i < ROOMS.length - 1) await sleep(REQUEST_GAP_MS);
        }

        if (successCount > 0) {
          document.getElementById('lastUpdated').textContent = '最終更新：' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        }
      } finally {
        refreshInProgress = false;
        if (btn) btn.disabled = false;
      }
    }

    function applyStatus(roomId, status) {
      if (!status) {
        updateRoom(roomId, 'checking', '確認中', '状況を確認しています。');
        return;
      }
      if (status.using) {
        const time = [status.startTime, status.endTime].filter(Boolean).join(' - ');
        const message = time ? time + ' 使用中' : (status.message || 'ただいま利用中です。');
        updateRoom(roomId, 'busy', '使用中', message);
      } else {
        updateRoom(roomId, 'free', '空室', '現在この会議室は空いています。');
      }
    }

    function applyError(roomId, message) {
      updateRoom(roomId, 'error', '未確認', '状況を取得できませんでした。' + (message ? '（' + message + '）' : ''));
    }

    function updateRoom(roomId, state, label, detail) {
      const zone = document.getElementById('zone-' + roomId);
      const pill = document.getElementById('pill-' + roomId);
      zone.classList.remove('free', 'busy', 'checking', 'error');
      zone.classList.add(state);
      pill.className = 'pill ' + state;
      pill.textContent = label;
      document.getElementById('map-status-' + roomId).textContent = label;
      document.getElementById('map-detail-' + roomId).textContent = detail;
      document.getElementById('side-detail-' + roomId).textContent = detail;
      zone.setAttribute('aria-label', zone.querySelector('.room-name').textContent + '：' + label + '。クリックして予約画面を開く');
    }
  </script>
